# --- Network Hardening ---
# Ignore ICMP echo requests (prevents some discovery/DoS)
net.ipv4.icmp_echo_ignore_all = 1
#
# Disable IP Source Routing (prevents spoofing)
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
#
# Disable ICMP Redirect Acceptance (prevents MITM attacks)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
#
# Enable Reverse Path Filtering (prevents IP spoofing)
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
#
# Log Martians (packets with impossible source addresses)
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1
#
# Protect against SYN flood attacks
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_max_syn_backlog = 2048
net.ipv4.tcp_synack_retries = 2
#
# Additional network hardening
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.icmp_ignore_bogus_error_responses = 1
net.ipv4.tcp_timestamps = 0
net.ipv4.tcp_rfc1337 = 1
#
# IPv6 Hardening
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0
#
# Disable IP Forwarding
net.ipv4.ip_forward = 0




# --- Kernel & Memory Hardening ---
# Address Space Layout Randomization (ASLR) - helps prevent buffer overflows
kernel.randomize_va_space = 2
#
# Restrict access to kernel logs (dmesg) to privileged users
kernel.dmesg_restrict = 1
#
# Restrict use of the ptrace() system call (prevents process snooping)
kernel.yama.ptrace_scope = 1
#
# Restrict BPF JIT compiler to the root user
net.core.bpf_jit_harden = 2
#
# Disable the Magic SysRq key (prevents physical reboot/dump bypasses)
kernel.sysrq = 0
#
# Additional kernel hardening
kernel.kptr_restrict = 2
kernel.perf_event_paranoid = 3
kernel.unprivileged_bpf_disabled = 1
fs.suid_dumpable = 0
dev.tty.ldisc_autoload = 0




# --- File System Hardening ---
# Prevent creating hardlinks/symlinks to files you don't own (prevents temp file races)
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
# Prevent users from creating files in world-writable sticky directories
fs.protected_fifos = 2
fs.protected_regular = 2