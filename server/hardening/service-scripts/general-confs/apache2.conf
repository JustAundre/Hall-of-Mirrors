# ------------------------------------------------------------------------------
# --- Apache Hardening ---------------------------------------------------------
# ------------------------------------------------------------------------------
# Reduce the time the server waits for client data (mitigates basic DoS)
Timeout 15
#
# Disable directory listing & following symbolic links
<Directory /var/www/>
	AllowOverride None
	Options -Indexes -Includes -FollowSymLinks
	Require all granted
</Directory>
#
# Hide version info & OS details
ServerTokens Prod
ServerSignature Off
#
# Prevent the server from being used in an iframe (Clickjacking protection)
Header always set X-Frame-Options "SAMEORIGIN"
#
# Enable XSS protection in the browser
Header set X-XSS-Protection "1; mode=block"
#
# Disable HTTP TRACE method (prevents Cross-Site Tracing)
TraceEnable Off