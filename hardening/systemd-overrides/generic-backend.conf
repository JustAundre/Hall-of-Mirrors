[Service]
# --- 1. Identity & Resource Limits ---
# User and Group to run the service as
# User=cdc
# Group=cdc
UMask=0027
# "DoS" protection: limits processes and memory
TasksMax=50
MemoryMax=512M
MemoryHigh=448M
CPUWeight=50

# --- 2. Filesystem Sandbox ---
ProtectSystem=full
ProtectHome=read-only
ProtectHostname=true
PrivateTmp=true
PrivateDevices=true
#
# Whitelist any cache/logging directories
# ReadWritePaths=

# --- 3. Kernel & Privilege Hardening ---
# Blindfold time!!! Prevents seeing other users' processes.
ProtectProc=invisible
NoNewPrivileges=true
LockPersonality=true
#
# Drops all "root-like" kernel capabilities
CapabilityBoundingSet=
RestrictNamespaces=true
RestrictSUIDSGID=true
ProtectControlGroups=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectClock=true

# --- 4. System Call Filtering ---
# Forces "64-bit" only execution
SystemCallArchitectures=native
SystemCallFilter=@system-service
#
# Blacklist dangerous calls like "reboot" or "module" loading
SystemCallFilter=~@clock @module @reboot @swap @privileged

# --- 5. Networking & IPC ---
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
#
# Set to "false" if the backend requires shared memory (e.g., some DBs)
RemoveIPC=true

# --- 6. Connectivity ---
# If using a local DB via a socket, uncomment the below and fill with the path to the socket:
# BindReadOnlyPaths=