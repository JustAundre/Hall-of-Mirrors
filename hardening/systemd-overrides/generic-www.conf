[Service]
User=www-data
Group=www-data

# Might break JIT compilation
MemoryDenyWriteExecute=true

# You'll likely never need to change this
UMask=0077
RuntimeDirectoryMode=0755
SystemCallFilter=@basic-io @file-system @system-service @network-io @process @signal @memlock @mmap
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
AmbientCapabilities=CAP_NET_BIND_SERVICE
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
NoNewPrivileges=true
LockPersonality=true
RestrictNamespaces=true
RestrictSUIDSGID=true
SystemCallArchitectures=native

# Adjust as needed.
RestrictRealtime=true
MemoryMax=2G
TasksMax=64

# The position of the frontend's root directory may warrant changes to these values.
ProtectSystem=strict
ProtectHome=tmpfs
ReadWritePaths=

# Stuff a frontend shouldn't need
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectKernelTunables=true
ProtectControlGroups=true
ProtectClock=true
ProtectHostname=true
ProtectProc=invisible
PrivateDevices=true
DevicePolicy=closed
PrivateTmp=true

# Something a frontend MIGHT need if it needs to connect to a local database/service
RemoveIPC=true

# May cause issues with Gunicorn/Flask services.
PrivateUsers=true